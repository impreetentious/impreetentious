<svg width="960" height="482" viewBox="0 0 960 482" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sid’s Daily</title>
  <desc id="desc">An editorial profile masthead for Sidakpreet Singh.</desc>

  <defs>
    <pattern id="editorialDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#A5482D"/>
    </pattern>
    <clipPath id="page">
      <rect width="960" height="482"/>
    </clipPath>
  </defs>

  <g clip-path="url(#page)">
    <rect width="960" height="482" fill="#F2E8D5"/>
    <circle cx="866" cy="160" r="126" fill="url(#editorialDots)" opacity="0.32"/>
    <rect x="806" y="87" width="154" height="184" fill="#F2E8D5" opacity="0.7"/>

    <g fill="#1C1814">
      <text x="36" y="50" font-family="Baskerville, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="42" font-weight="700">Sid’s Daily</text>
      <text x="300" y="45" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="1.1">Independent profile / issue 01</text>
      <text x="742" y="45" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="1.1">Read time / one glance</text>

      <line x1="36" y1="68" x2="924" y2="68" stroke="#1C1814" stroke-width="2.5"/>
      <line x1="36" y1="75" x2="924" y2="75" stroke="#1C1814" stroke-width="1"/>

      <text x="36" y="139" font-family="Baskerville, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="-0.45">Product person tokenmaxxes.</text>
      <text x="36" y="191" font-family="Baskerville, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="-0.45">Compliments keep the lights on.</text>
      <rect x="36" y="211" width="108" height="7" fill="#A5482D"/>

      <text x="36" y="253" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.15">Filed under: product / tokens / internet habits</text>
      <text x="36" y="282" font-family="Baskerville, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#6E6256">The footnotes are doing most of the work.</text>

      <text x="854" y="111" fill="#6E6256" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0.9">Issue</text>
      <text x="815" y="190" fill="#A5482D" font-family="Baskerville, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="88" font-weight="700">01</text>

      <line x1="36" y1="304" x2="924" y2="304" stroke="#1C1814" stroke-width="1"/>

      <text x="36" y="354" font-family="Baskerville, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="-0.25">Sidakpreet Singh</text>
      <text x="36" y="384" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500">strategy × software × an irresponsible relationship</text>
      <text x="36" y="410" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="500">with context windows.</text>

      <line x1="576" y1="323" x2="576" y2="428" stroke="#1C1814" stroke-width="1"/>

      <text x="604" y="343" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" letter-spacing="0.8" fill="#6E6256">Current beat</text>
      <text x="604" y="375" font-family="Baskerville, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">Product</text>

      <text x="772" y="343" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" letter-spacing="0.8" fill="#6E6256">Token policy</text>
      <text x="772" y="375" font-family="Baskerville, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">Maximal</text>

      <text x="604" y="405" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" letter-spacing="0.8" fill="#6E6256">Power source</text>
      <text x="604" y="433" font-family="Baskerville, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">Curiosity</text>

      <line x1="36" y1="449" x2="924" y2="449" stroke="#1C1814" stroke-width="1"/>
      <text x="36" y="472" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0.8">sidakpreetsingh.com</text>
      <text x="879" y="472" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0.8">p. 01</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="958.5" height="480.5" stroke="#1C1814" stroke-width="1.5"/>
</svg>
